<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Kayu Olahan IBS</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color:#27213a;background:#f6f3fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#44247e,#7852bc);color:white;padding:30px 20px}main{max-width:1100px;margin:auto;padding:22px 15px}h1{font-size:clamp(22px,4vw,32px);margin:0}header p{opacity:.88} .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card,section{background:white;border:1px solid #e9e1f4;border-radius:15px;box-shadow:0 4px 18px #42217b0d;padding:20px}.card span{color:#746987;font-size:14px}.card strong{display:block;color:#502b89;font-size:clamp(19px,3vw,31px);margin-top:8px}.card small{font-size:12px;color:#746987}button{background:#6037a4;color:white;border:0;border-radius:9px;padding:12px 18px;cursor:pointer;font-weight:600}button:hover{background:#48237f}section{margin-top:20px}section[hidden]{display:none}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}input{padding:10px;border:1px solid #d5c7e9;border-radius:8px;max-width:100%;flex:1;min-width:200px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:12px 10px;text-align:left;border-bottom:1px solid #eee9f4}th{background:#f0eafa;white-space:nowrap}td:nth-child(5),th:nth-child(5){text-align:right;white-space:nowrap}td:nth-child(1){text-align:center}#status{font-size:13px;color:#716881}@media(max-width:600px){.cards{grid-template-columns:1fr}.card{padding:15px}.card strong{font-size:25px}}</style></head>
<body><header><main style="padding:0"><h1>Stock Kayu Olahan IBS</h1><p>Ringkasan dan riwayat dokumen pengangkutan</p></main></header><main><div class="cards"><div class="card"><span>Stock Awal</span><strong id="awal">—</strong><small>m³</small></div><div class="card"><span>Pengurangan (Diangkut)</span><strong id="kurang">—</strong><small>m³</small></div><div class="card"><span>Sisa Stock</span><strong id="akhir">—</strong><small>m³</small></div></div><section><div class="toolbar"><button id="toggle" type="button" aria-expanded="false">Lihat Detail DKO</button><span id="status">Memuat data...</span></div><div id="detail" hidden><div class="toolbar"><input id="filter" type="search" placeholder="Cari tanggal, DKO, seri atau tujuan..."><span id="count"></span></div><div class="tablewrap"><table><thead><tr><th>NO</th><th>TANGGAL</th><th>NO DKO</th><th>SERI SKSHHK</th><th>VOLUME (m³)</th><th>TUJUAN</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main>
<script>
// CSV parser supporting quoted commas, newlines, and UTF-8 BOM.
function parseCSV(s){s=s.replace(/^\uFEFF/,'');let rows=[],row=[],field='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&s[i+1]==='\n')i++;row.push(field);if(row.some(x=>x!==''))rows.push(row);row=[];field=''}else field+=c}row.push(field);if(row.some(x=>x!==''))rows.push(row);let head=rows.shift()||[];return rows.map(r=>Object.fromEntries(head.map((k,i)=>[k,r[i]||''])))}
let entries=[];const $=id=>document.getElementById(id),num=s=>Number(s).toLocaleString('id-ID',{minimumFractionDigits:4,maximumFractionDigits:4});
function render(){let q=$('filter').value.toLowerCase();let shown=entries.filter(r=>[r.no,r.tanggal,r.no_dko,r.seri_skshhk,r.volume_m3,r.tujuan].join(' ').toLowerCase().includes(q));$('rows').replaceChildren(...shown.map(r=>{let tr=document.createElement('tr');for(let v of [r.no,r.tanggal,r.no_dko,r.seri_skshhk,num(r.volume_m3),r.tujuan]){let td=document.createElement('td');td.textContent=v;tr.append(td)}return tr}));$('count').textContent=`${shown.length} dokumen`}
$('filter').addEventListener('input',render);$('toggle').addEventListener('click',()=>{let open=$('detail').hidden;$('detail').hidden=!open;$('toggle').textContent=open?'Tutup Detail DKO':'Lihat Detail DKO';$('toggle').setAttribute('aria-expanded',String(open))});
(async()=>{try{let res=await fetch('./stock_olahan_ibs.csv?v='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);let data=parseCSV(await res.text()),summary=data.find(r=>r.tipe==='RINGKASAN');if(!summary)throw Error('Ringkasan tidak ditemukan');$('awal').textContent=num(summary.stock_awal_m3);$('kurang').textContent=num(summary.pengurangan_m3);$('akhir').textContent=num(summary.stock_akhir_m3);entries=data.filter(r=>r.tipe==='DETAIL');render();$('status').textContent='Data berhasil dimuat'}catch(e){$('status').textContent='Gagal memuat CSV: '+e.message;console.error(e)}})();
</script></body></html>
